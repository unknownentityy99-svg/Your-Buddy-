<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Your Buddy</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17191f;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:900px;margin:auto}
.card{background:white;border:1px solid #e1e5ea;border-radius:18px;padding:18px;margin:14px 0}
h1{margin:0 0 4px}h2{margin:0 0 6px}.muted{color:#68707d}
button,input{font:inherit}button{min-height:44px;border-radius:11px;padding:0 14px;cursor:pointer}
.primary{background:#2563eb;color:white;border:0}.secondary{background:white;border:1px solid #ccd2da}
form{display:flex;gap:8px}input{min-height:44px;border:1px solid #ccd2da;border-radius:11px;padding:0 12px;width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e1e5ea;border-radius:14px;padding:14px}
.days{display:grid;grid-template-columns:minmax(150px,1fr) repeat(7,38px) 40px;gap:6px;align-items:center;overflow:auto}
.day{width:38px;height:38px;padding:0;border:1px solid #ccd2da;background:white}.done{background:#2563eb;color:white;border-color:#2563eb}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.date{min-height:44px;border:1px solid #d9dee5;background:white}.marked{background:#dbeafe}
.bar{height:10px;border-radius:20px;background:#e7ebf0;overflow:hidden}.fill{height:100%;background:#2563eb}
@media(max-width:600px){body{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:minmax(120px,1fr) repeat(7,32px) 38px}.day{width:32px;height:32px;font-size:12px}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Your Buddy</h1><p class="muted">Small actions. Consistent progress.</p>
<button id="export" class="primary">Download this app file</button>
</section>

<section class="card">
<h2>Add a habit</h2>
<form id="add"><input id="name" maxlength="50" placeholder="e.g. Drink 2L water" required><button class="primary">Add</button></form>
</section>

<section class="stats">
<div class="stat"><span class="muted">Habits</span><h2 id="count">0</h2></div>
<div class="stat"><span class="muted">Today</span><h2 id="today">0%</h2></div>
<div class="stat"><span class="muted">Best streak</span><h2 id="streak">0 🔥</h2></div>
<div class="stat"><span class="muted">Total checks</span><h2 id="total">0</h2></div>
</section>

<section class="card"><h2>This week</h2><div id="list" class="days"></div></section>

<section class="card"><h2>Statistics</h2><p class="muted">Last 7 days</p><div class="bar"><div id="weekbar" class="fill" style="width:0"></div></div><p id="weektext" class="muted">0%</p><div id="individual"></div></section>

<section class="card"><h2>Calendar</h2><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button id="prev" class="secondary">‹</button><strong id="month"></strong><button id="next" class="secondary">›</button></div><div id="calendar" class="calendar"></div></section>
</main>

<script>
(function(){
const KEY='yourBuddyHabits';
let habits=JSON.parse(localStorage.getItem(KEY)||'[]');
let view=new Date();

function save(){localStorage.setItem(KEY,JSON.stringify(habits))}
function key(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}
function today(){return key(new Date())}
function streak(h){
 let s=new Set(h.dates), cur=0, best=0, d=new Date();
 for(let i=0;i<366;i++){let k=key(d);if(s.has(k)){cur++;best=Math.max(best,cur)}else if(i>0)cur=0;d.setDate(d.getDate()-1)}
 return best
}
function render(){
 const list=document.getElementById('list'); list.innerHTML='';
 ['M','T','W','T','F','S','S'].forEach(x=>{let e=document.createElement('div');e.className='muted';e.textContent=x;list.appendChild(e)});
 list.appendChild(document.createElement('div'));
 let week=[];
 for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);week.push(key(d))}
 habits.forEach(h=>{
   let n=document.createElement('div');n.textContent=h.name;list.appendChild(n);
   week.forEach(k=>{let b=document.createElement('button');b.className='day '+(h.dates.includes(k)?'done':'');b.textContent=h.dates.includes(k)?'✓':'';b.onclick=()=>{if(h.dates.includes(k))h.dates=h.dates.filter(x=>x!==k);else h.dates.push(k);save();render()};list.appendChild(b)});
   let del=document.createElement('button');del.className='secondary';del.textContent='×';del.onclick=()=>{habits=habits.filter(x=>x.id!==h.id);save();render()};list.appendChild(del);
 });
 let t=habits.filter(h=>h.dates.includes(today())).length;
 document.getElementById('count').textContent=habits.length;
 document.getElementById('today').textContent=(habits.length?Math.round(t/habits.length*100):0)+'%';
 document.getElementById('total').textContent=habits.reduce((a,h)=>a+h.dates.length,0);
 document.getElementById('streak').textContent=Math.max(0,...habits.map(streak))+' 🔥';
 let possible=habits.length*7, checks=habits.reduce((a,h)=>a+h.dates.filter(k=>week.includes(k)).length,0), p=possible?Math.round(checks/possible*100):0;
 document.getElementById('weekbar').style.width=p+'%';document.getElementById('weektext').textContent=p+'%';
 let ind=document.getElementById('individual');ind.innerHTML='';
 habits.forEach(h=>{let n=h.dates.filter(k=>week.includes(k)).length;let p=n/7*100;let d=document.createElement('p');d.innerHTML='<b>'+h.name+'</b> — '+n+'/7<div class="bar"><div class="fill" style="width:'+p+'%"></div></div>';ind.appendChild(d)});
 renderCalendar();
}
function renderCalendar(){
 let c=document.getElementById('calendar');c.innerHTML='';
 let y=view.getFullYear(),m=view.getMonth();document.getElementById('month').textContent=view.toLocaleString(undefined,{month:'long',year:'numeric'});
 ['M','T','W','T','F','S','S'].forEach(x=>{let e=document.createElement('div');e.className='muted';e.textContent=x;c.appendChild(e)});
 let first=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<first;i++)c.appendChild(document.createElement('div'));
 let days=new Date(y,m+1,0).getDate();
 for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=key(dt),b=document.createElement('button');b.className='date '+(habits.some(h=>h.dates.includes(k))?'marked':'');b.textContent=d;b.onclick=()=>{if(!habits.length)return;habits[0].dates.includes(k)?habits.forEach(h=>h.dates=h.dates.filter(x=>x!==k)):habits.forEach(h=>h.dates.push(k));save();render()};c.appendChild(b)}
}
document.getElementById('add').onsubmit=e=>{e.preventDefault();let n=document.getElementById('name').value.trim();if(n){habits.push({id:Date.now(),name:n,dates:[]});document.getElementById('name').value='';save();render()}};
document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};
document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};
document.getElementById('export').onclick=()=>{let blob=new Blob([document.documentElement.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};
render();
})();
</script>
</body>
</html>
